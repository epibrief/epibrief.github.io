name: 전자책 PDF 자동 생성

# ebook/*.html 이 바뀌면 같은 이름의 PDF 를 만들어 함께 커밋합니다.
on:
  push:
    paths: ['ebook/*.html', 'scripts/build_ebook_pdf.mjs']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 크롬 설치
        run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: PDF 생성
        run: node scripts/build_ebook_pdf.mjs
      - name: 변경 시 커밋
        run: |
          if git diff --quiet -- 'ebook/*.pdf' && [ -z "$(git ls-files --others --exclude-standard ebook/*.pdf)" ]; then
            echo "변경 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ebook/*.pdf
            git commit -m "전자책 PDF 자동 생성"
            git push
          fi
